server:
  port: 8080

spring:
  application:
    name: ApiGateway

  cloud:
    gateway:
      routes:
        - id: playlist-service
          uri: lb://PlaylistService
          predicates:
            - Path=/playlists/**

        - id: track-service
          uri: lb://TrackService
          predicates:
            - Path=/tracks/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/